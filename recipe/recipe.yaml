schema_version: 1

context:
  version: "1.3.2"
  build_number: 3
  
  library: ${{ "" if unix else "Library/" }}
  sh: ${{ ".bat" if not unix else ".sh" }}

recipe:
  name: zlib-split
  version: ${{ version }}

source:
  url: http://zlib.net/zlib-${{ version }}.tar.gz
  sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16

build:
  number: ${{ build_number }}

outputs:
  - staging:
      name: zlib-build
    build:
      script:
        file: build${{ sh }}
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ "" if unix else "c" }}make
        - if: target_platform == "linux-riscv64"
          then:
            - ${{ compiler('zig') }}
          else:
            - ${{ compiler('c') }}

  - package:
      name: libzlib
    inherit: zlib-build
    build:
      files:
        - if: linux
          then:
            - lib/libz.so.*
        - if: osx
          then:
            - lib/libz.*.dylib
        - if: not unix
          then:
            - ${{ library }}bin/zlib.dll
            - zlib.dll
    requirements:
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
      build:
        - ${{ stdlib('c') }}
        - ${{ "" if unix else "c" }}make
        - if: target_platform == "linux-riscv64"
          then:
            - ${{ compiler('zig') }}
          else:
            - ${{ compiler('c') }}
      host:
      run:
      run_constraints:
        - zlib ==${{ version }} *_${{ build_number }}
    tests:
      - package_contents:
          strict: true
          lib:
            - zlib
          files:
            - if: not unix
              then:
                - zlib.dll

  - package:
      name: libzlib-wapi
    inherit: zlib-build
    build:
      skip: unix
      files:
        - ${{ library }}bin/zlibwapi.dll
    requirements:
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
      build:
        - ${{ stdlib('c') }}
        - ${{ "" if unix else "c" }}make
        - if: target_platform == "linux-riscv64"
          then:
            - ${{ compiler('zig') }}
          else:
            - ${{ compiler('c') }}
      host:
      run:
      run_constraints:
        - zlib ==${{ version }} *_${{ build_number }}
        - zlib-wapi ==${{ version }} *_${{ build_number }}
    tests:
      - package_contents:
          strict: true
          lib:
            - zlibwapi

  - package:
      name: zlib
    inherit: zlib-build
    build:
      files:
        - ${{ library }}include
        - ${{ library }}lib/pkgconfig
        - if: unix
          then:
            - lib/libz.a
          else:
            - ${{ library }}share
            - ${{ library }}lib/z.lib
            - ${{ library }}lib/zlibstatic.lib
    requirements:
      run_exports:
        - ${{ pin_subpackage('libzlib', upper_bound='x') }}
      build:
        - ${{ stdlib('c') }}
        - ${{ "" if unix else "c" }}make
        - if: target_platform == "linux-riscv64"
          then:
            - ${{ compiler('zig') }}
          else:
            - ${{ compiler('c') }}
      host:
        - ${{ pin_subpackage('libzlib', exact=True) }}
      run:
        - ${{ pin_subpackage('libzlib', exact=True) }}
    tests:
      - package_contents:
          strict: true
          files:
            - ${{ library }}include
            - ${{ library }}lib/pkgconfig
            - if: unix
              then:
                - lib/libz.a
              else:
                - ${{ library }}share
                - ${{ library }}lib/z.lib
                - ${{ library }}lib/zlibstatic.lib
                - etc/conda/test-files/*
      - script:
          - if: not unix
            then:
              - call test_compile_flags.bat
            else:
              - echo "Done"
        requirements:
          run:
            - ${{ compiler("c") }}
        files:
          recipe:
            - test_compile_flags.bat
            - test_compile_flags.c

  - package:
      name: zlib-wapi
    inherit: zlib-build
    build:
      skip: unix
      files:
        - ${{ library }}lib/zlibwapi.lib
        - ${{ library }}include/zlib.h
    requirements:
      run_exports:
        - ${{ pin_subpackage('libzlib-wapi', upper_bound='x') }}
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
      host:
        - ${{ pin_subpackage('libzlib-wapi', exact=True) }}
        - ${{ pin_subpackage('zlib', exact=True) }}
      run:
        - ${{ pin_subpackage('libzlib-wapi', exact=True) }}
        - ${{ pin_subpackage('zlib', exact=True) }}
    tests:
      - package_contents:
          strict: true
          files:
            - ${{ library }}lib/zlibwapi.lib
            - ${{ library }}include/zlib.h
      - script:
          - if: not unix
            then:
              - call test_compile_flags.bat "wapi"
            else:
              - echo "Done"
        requirements:
          run:
            - ${{ compiler("c") }}
        files:
          recipe:
            - test_compile_flags.bat
            - test_compile_flags.c

about:
  homepage: http://zlib.net/
  license: Zlib
  summary: Massively spiffy yet delicately unobtrusive compression library
  license_family: Other
  license_file: LICENSE
  description: |
    zlib is designed to be a free, general-purpose, lossless data-compression
    library for use on virtually any computer hardware and operating system.
  documentation: http://zlib.net/manual.html
  repository: https://github.com/madler/zlib

extra:
  recipe-maintainers:
    - groutr
    - msarahan
    - ocefpaf
    - isuruf
  feedstock-name: zlib
